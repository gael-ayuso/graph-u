services:
  db:
    image: postgres:18
    command: ["postgres", "-p", "5431"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: graphu
    ports:
      - "127.0.0.1:5431:5431"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5431 -U graphu -d graphu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
